<title id="title">OaK and PPO across the 8 environment categories</title>
<desc id="desc">Mean normalized reward per step over the final 100,928 steps of the 1,000,000-step best recording, one axis per declared category with its environment count, the better of Random and the constant do-nothing policy at 0 and Oracle at 1. The radius is linear. The floor ring is the better of Random and the constant policy in every environment, so their category means lie at or below it; their exact values are in the ranking and the axis table. Outlines only: the polygon area is not the score. The overall ranking is the equal-weight mean over all 245 environments.</desc>
