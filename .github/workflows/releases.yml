name: releases
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          allowed=$(python fleet.py tags)
          if printf '%s\n' "$allowed" | grep -qx "$TAG"; then
            echo "$TAG is the committed best"
          else
            echo "$TAG is not the committed best; deleting"
            gh release delete "$TAG" --cleanup-tag --yes
            exit 1
          fi
